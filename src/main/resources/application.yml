server:
  port: 8082

spring:
  application:
    name: itinerary-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:itinerary_db}
    username: ${DB_USERNAME:itinerary_user}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

integrations:
  airport-service:
    base-url: ${AIRPORT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

resilience4j:
  retry:
    instances:
      airportService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.itinerarios.itinerary.exception.ExternalServiceException
        ignore-exceptions:
          # Un 404 (aeropuerto inexistente) es una respuesta de negocio
          # válida, no una falla transitoria. Reintentarlo no cambiaría el
          # resultado y violaría la regla de la sección 28 de no reintentar
          # indiscriminadamente.
          - com.itinerarios.itinerary.exception.InvalidAirportException
  circuitbreaker:
    instances:
      airportService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.itinerarios.itinerary.exception.ExternalServiceException
        ignore-exceptions:
          - com.itinerarios.itinerary.exception.InvalidAirportException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
