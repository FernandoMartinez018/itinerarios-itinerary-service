server:
  port: 8082

spring:
  application:
    name: itinerary-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:itinerary_db}
    username: ${DB_USERNAME:itinerary_user}
    password: ${DB_PASSWORD:changeme}

  mvc:
    # API versioning nativo de Spring Framework 7 (paso 31). Header en vez de ruta para no
    # romper Gateway, frontend ni E2E: sin header se atiende la v1.
    apiversion:
      use:
        header: API-Version
      default: 1
      supported: 1,2
      required: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

integrations:
  airport-service:
    base-url: ${AIRPORT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

outbox:
  publisher:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}

resilience4j:
  retry:
    instances:
      airportService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.itinerarios.itinerary.exception.ExternalServiceException
        ignore-exceptions:
          # Un 404 (aeropuerto inexistente) es una respuesta de negocio
          # válida, no una falla transitoria. Reintentarlo no cambiaría el
          # resultado y violaría la regla de la sección 28 de no reintentar
          # indiscriminadamente.
          - com.itinerarios.itinerary.exception.InvalidAirportException
          # Breaker abierto: fallar rapido, no reintentar (la llamada ni se intento).
          - com.itinerarios.itinerary.exception.CircuitOpenException
          # Bulkhead lleno: saturacion local; reintentar solo agrega carga.
          - com.itinerarios.itinerary.exception.AirportServiceSaturatedException
  circuitbreaker:
    instances:
      airportService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.itinerarios.itinerary.exception.ExternalServiceException
        ignore-exceptions:
          - com.itinerarios.itinerary.exception.InvalidAirportException
          # Bulkhead lleno no es un fallo de Airport Service: no debe abrir el circuito.
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      airportService:
        # Bulkhead semaforo (paso 31, seccion 108): como mucho 10 validaciones concurrentes hacia
        # Airport Service; si Airport se pone lento, el resto falla rapido (503) en vez de agotar
        # los hilos de Tomcat y tumbar tambien GET/PUT/DELETE de itinerarios.
        max-concurrent-calls: ${AIRPORT_BULKHEAD_MAX_CALLS:10}
        max-wait-duration: ${AIRPORT_BULKHEAD_MAX_WAIT:100ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
