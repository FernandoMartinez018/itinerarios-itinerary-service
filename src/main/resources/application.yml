server:
  port: 8082

spring:
  application:
    name: itinerary-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:itinerary_db}
    username: ${DB_USERNAME:itinerary_user}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

integrations:
  airport-service:
    base-url: ${AIRPORT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
